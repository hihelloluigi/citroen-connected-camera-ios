# CodeQL — static analysis
#
# Same trigger policy as ci.yml: main is the gate, plan branches don't burn runner time. The
# weekly schedule runs against the default branch and catches rules added to the Swift query
# pack after a commit landed, which a push-only trigger never would.
#
# Swift has no autobuild, so this is `build-mode: manual`: CodeQL watches a real xcodebuild
# invocation to find the sources. That means the project has to be generated first — the
# .xcodeproj is git-ignored, see .gitignore — so the Mint and XcodeGen steps are not optional
# here the way they might look.
#
# This file replaces GitHub's default CodeQL setup. The two cannot both be enabled: with
# default setup on, an advanced workflow's results are rejected. Disable it under
# Settings → Code security → Code scanning → Default setup before expecting a green run.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    # Generous on purpose: a Swift CodeQL build is 2-4x a normal one and this workflow has no
    # settled baseline yet. Tighten once a few runs have reported real numbers — a timeout that
    # fires reads as a broken workflow rather than a slow one.
    timeout-minutes: 90

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Tooling ─────────────────────────────────────────────────────────────────────────
      # Mint, not a bare brew install: the Mintfile is what pins XcodeGen 2.45.4, and a
      # different XcodeGen generates a different project than a developer's machine does.
      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@v4
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}
          restore-keys: mint-${{ runner.os }}-

      - name: Bootstrap pinned tools
        run: mint bootstrap

      # Same cache as ci.yml. Without it every run re-resolves the package graph and
      # re-downloads the SwiftLint binary artifact before the build can even start.
      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: mint run xcodegen generate

      # ── Analysis ────────────────────────────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # Build only — the test bundles are ci.yml's job, and building them here would double
      # the runtime to analyse code that never ships.
      #
      # ARCHS=arm64 is the difference between a 20-minute job and a 40-minute one. A
      # `generic/platform=iOS Simulator` destination resolves to `ARCHS = arm64 x86_64`, so every
      # file is compiled twice and CodeQL extracts both slices — for one analysis, since the two
      # differ in codegen and not in source. ci.yml never hit this because it builds against a
      # concrete simulator id, which sets ONLY_ACTIVE_ARCH=YES.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CitroenConnectedCamera.xcodeproj \
            -scheme Development \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
